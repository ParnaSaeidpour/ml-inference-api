name: CI

# Run on every push and every pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU-only PyTorch: skips ~2 GB of CUDA libraries
          pip install torch==2.15.0 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        env:
          YOLO_OFFLINE: "1"
        run: pytest -v

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test          # only build if the tests passed

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t defect-api:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api defect-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/health && break
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail -F "file=@tests/fixtures/scratches_122.jpg" http://localhost:8000/predict
          docker stop api
