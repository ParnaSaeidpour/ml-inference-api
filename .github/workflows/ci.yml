name: CI

# Run on every push and every pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test          # only build if the tests passed

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ml-inference-api:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api ml-inference-api:${{ github.sha }}
          sleep 10
          curl --fail http://localhost:8000/health
          docker stop api
